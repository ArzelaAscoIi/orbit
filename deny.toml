# `cargo deny check licenses` (make licenses, CI's "licenses" job): every
# dependency's license must be on this list. All permissive, notice only:
# no copyleft (option-ext, MPL-2.0, is replaced by vendor/option-ext) and
# no bundled fonts (theme.rs reads them from the Mac). A GPL-only (or any
# unlisted) license fails the check.
# Vulnerabilities stay with `cargo audit` (ci.yml).

[graph]
# The app ships for macOS only (scripts/bundle-macos.sh).
targets = ["aarch64-apple-darwin"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    # MIT-like, notice only: libloading (OpenGL), foldhash and zlib-rs,
    # Unicode's data tables (unicode-normalization, idna_mapping).
    "ISC",
    "Zlib",
    "Unicode-3.0",
]

[licenses.private]
ignore = true
