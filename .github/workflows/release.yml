# A release: push a `v<version>` tag (`make release V=<version>` does it) and
# this builds the Apple silicon macOS app, zips it, and publishes it as a GitHub
# release with the zip's SHA-256 beside it (the in-app update checks it).
# Install: download the zip from the release, unzip, move the app to
# Applications (README, "Install").
#
# Two jobs: `build` compiles and tests with a read-only token and no cache
# (nothing a crate's build script runs can touch the release); `publish`
# only uploads what `build` produced. Third-party actions are pinned by SHA.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag matches Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "${GITHUB_REF_NAME}" = "v${version}" \
            || { echo "tag ${GITHUB_REF_NAME} but Cargo.toml says ${version}"; exit 1; }

      - name: Rust
        # The version and components rust-toolchain.toml pins, as in CI.
        run: rustup toolchain install

      - name: Check
        run: make check

      - name: Build the app
        env:
          # The app updates from the repo that published it.
          ORBIT_RELEASES_REPO: ${{ github.repository }}
        run: make bundle  # picks up overlay.mk in a company fork

      - name: SHA-256
        working-directory: dist
        run: for zip in *-macos.zip; do shasum -a 256 "$zip" > "$zip.sha256"; done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: dist/*-macos.zip*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v0.0.1-rc1 and the like are release candidates.
          pre=""
          case "${GITHUB_REF_NAME}" in *-*) pre="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/*-macos.zip dist/*-macos.zip.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Orbit ${GITHUB_REF_NAME}" \
            --generate-notes $pre
