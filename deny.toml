# `cargo deny check licenses` (make licenses, CI's "licenses" job): every
# dependency's license must be on this list. All permissive, except
# MPL-2.0, which is copyleft per file only: fine while those files are
# used unmodified. A GPL-only (or any unlisted) license fails the check.
# Vulnerabilities stay with `cargo audit` (ci.yml).

[graph]
# The app ships for macOS only (scripts/bundle-macos.sh).
targets = ["aarch64-apple-darwin"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    # MIT-like, notice only: libloading (OpenGL), foldhash and zlib-rs,
    # Unicode's data tables (unicode-normalization, idna_mapping).
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # option-ext, through dirs, which wry needs on macOS.
    "MPL-2.0",
    # egui's bundled fonts.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[licenses.private]
ignore = true
