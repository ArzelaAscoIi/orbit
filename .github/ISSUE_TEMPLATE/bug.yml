name: Bug
description: Something in Orbit does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → about
      placeholder: v0.0.8
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Local agent
      options: [Claude Code, Codex]
  - type: dropdown
    id: profile
    attributes:
      label: Profile
      options: [none (generic), my own]
  - type: textarea
    id: logs
    attributes:
      label: Errors
      description: Anything from `~/Library/Application Support/Orbit/errors.log` or the session's output. Never paste keys.
      render: text
