# `cargo about generate about.hbs` writes the third-party license notices
# that ship in Orbit.app/Contents/Resources (scripts/bundle-macos.sh).
# Same list as deny.toml, which fails CI on anything else.
accepted = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
targets = ["aarch64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
